aid: empathy
name: Empathy
description: >-
  Empathy is a support platform that helps organizations guide people through
  loss, leave, and legacy moments, combining AI with human care to serve
  individuals navigating grief, estate planning, and major life transitions. Its
  products include LifeVault digital estate planning, Loss Support for
  beneficiaries handling claims and grief, Leave Support for employees during
  difficult life events, and Client Connect for advisors. Empathy sells to life
  insurance companies, banks and wealth managers, employers, health plans, and
  benefit consultants, covering 50M+ individuals. Backed by General Catalyst and
  Index Ventures. As of this profile Empathy publishes no public developer or
  API surface.
